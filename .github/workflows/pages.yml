name: Build and deploy publication
on:
  push:
    branches: [main, release/v1.1-preview-2026-09-22]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run preflight
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - name: Check domain-root build
        run: BASE_PATH='' npm run build && npm run check
      - name: Restore Pages project build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Preview release branch deploys intentionally without merging to main.
    # Main keeps the explicit PUBLISH_APPROVED gate.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/release/v1.1-preview-2026-09-22' || (github.ref == 'refs/heads/main' && vars.PUBLISH_APPROVED == 'true'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
